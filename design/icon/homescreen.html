<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8" />
<title>Beginscherm-voorbeeld</title>
<style>
  /* Nagemaakt iPhone-beginscherm om app-icoonontwerpen in context te beoordelen. */
  * { box-sizing: border-box; margin: 0; }
  body { width: 390px; height: 844px; overflow: hidden; font-family: -apple-system, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif; }
  .screen { position: relative; width: 390px; height: 844px; padding: 0 22px; color: #fff; background: var(--wall); }
  .wall-dark { --wall: radial-gradient(120% 70% at 20% 10%, #3b4f8f 0%, rgba(59,79,143,0) 60%), radial-gradient(90% 60% at 90% 80%, #7a3f7f 0%, rgba(122,63,127,0) 60%), #151a2e; }
  .wall-light { --wall: radial-gradient(120% 70% at 20% 10%, #b9e3ff 0%, rgba(185,227,255,0) 60%), radial-gradient(90% 60% at 90% 85%, #ffd3b0 0%, rgba(255,211,176,0) 60%), #e9eef8; }
  .status { height: 54px; display: flex; align-items: center; justify-content: space-between; padding: 12px 12px 0; font-weight: 600; font-size: 17px; }
  .status .r { display: flex; gap: 6px; align-items: center; }
  .grid { display: grid; grid-template-columns: repeat(4, 64px); justify-content: space-between; row-gap: 26px; margin-top: 22px; }
  .app { display: flex; flex-direction: column; align-items: center; gap: 6px; width: 64px; }
  .ic { width: 64px; height: 64px; border-radius: 15px; overflow: hidden; display: grid; place-items: center; box-shadow: 0 2px 6px rgba(0,0,0,.18); }
  .ic svg, .ic img { width: 100%; height: 100%; display: block; }
  .lbl { font-size: 12px; font-weight: 500; text-shadow: 0 1px 2px rgba(0,0,0,.35); white-space: nowrap; }
  .wall-light .lbl { color: #1c1c1e; text-shadow: none; }
  .search { position: absolute; left: 50%; bottom: 128px; transform: translateX(-50%); padding: 7px 16px; border-radius: 16px; background: rgba(255,255,255,.22); backdrop-filter: blur(10px); font-size: 14px; font-weight: 600; }
  .dock { position: absolute; left: 12px; right: 12px; bottom: 22px; height: 94px; border-radius: 34px; background: rgba(255,255,255,.22); backdrop-filter: blur(14px); display: flex; justify-content: space-around; align-items: center; padding: 0 12px; }
  .hl .ic { outline: 0; }
</style>
</head>
<body>
<div class="screen" id="screen">
  <div class="status"><span>9:41</span><span class="r">
    <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1" fill="currentColor"/><rect x="5" y="5" width="3" height="7" rx="1" fill="currentColor"/><rect x="10" y="2.5" width="3" height="9.5" rx="1" fill="currentColor"/><rect x="15" y="0" width="3" height="12" rx="1" fill="currentColor"/></svg>
    <svg width="26" height="12" viewBox="0 0 26 12"><rect x="0.5" y="0.5" width="22" height="11" rx="3.5" fill="none" stroke="currentColor" opacity=".5"/><rect x="2" y="2" width="17" height="8" rx="2" fill="currentColor"/><rect x="23.5" y="4" width="2" height="4" rx="1" fill="currentColor" opacity=".5"/></svg>
  </span></div>
  <div class="grid" id="grid"></div>
  <div class="search">🔍 Zoek</div>
  <div class="dock" id="dock"></div>
</div>
<script>
  // Eenvoudige, neutrale icoontjes voor de "andere apps" (geen echte merklogo's).
  const g = (bg, inner) => `<svg viewBox="0 0 64 64"><defs><linearGradient id="x${Math.random().toString(36).slice(2)}" x1="0" y1="0" x2="0" y2="1"></linearGradient></defs><rect width="64" height="64" fill="${bg}"/>${inner}</svg>`;
  const APPS = {
    Klok: g('#111', '<circle cx="32" cy="32" r="22" fill="#fff"/><path d="M32 18v14l9 6" stroke="#111" stroke-width="3" fill="none" stroke-linecap="round"/>'),
    Weer: g('linear-gradient', '') ,
    Agenda: g('#fff', '<text x="32" y="22" font-size="10" text-anchor="middle" fill="#e5352b" font-weight="700" font-family="sans-serif">WOENSDAG</text><text x="32" y="50" font-size="30" text-anchor="middle" fill="#111" font-family="sans-serif">30</text>'),
    "Foto's": g('#fff', [0,45,90,135,180,225,270,315].map((a,i)=>`<ellipse cx="32" cy="20" rx="7" ry="12" fill="${['#f5a623','#f8e71c','#7ed321','#50e3c2','#4a90e2','#9013fe','#e94b8a','#f55'][i]}" opacity=".85" transform="rotate(${a} 32 32)"/>`).join('')),
    Camera: g('#8e8e93', '<rect x="12" y="20" width="40" height="28" rx="6" fill="#2c2c2e"/><circle cx="32" cy="34" r="9" fill="#636366"/><circle cx="32" cy="34" r="5" fill="#1c1c1e"/>'),
    Notities: g('#fff', '<rect width="64" height="16" fill="#ffd60a"/><path d="M12 28h40M12 36h40M12 44h30" stroke="#c7c7cc" stroke-width="2"/>'),
    Kaarten: g('#b8e0a8', '<path d="M0 40 L64 22 V34 L0 52Z" fill="#f6d365"/><path d="M36 0 V64" stroke="#fff" stroke-width="6"/><circle cx="42" cy="22" r="6" fill="#0a84ff"/>'),
    Berichten: g('#34c759', '<ellipse cx="32" cy="30" rx="20" ry="16" fill="#fff"/><path d="M18 40 L14 50 L26 44Z" fill="#fff"/>'),
    Mail: g('#0a84ff', '<rect x="12" y="20" width="40" height="26" rx="4" fill="#fff"/><path d="M12 22 L32 36 L52 22" stroke="#0a84ff" stroke-width="3" fill="none"/>'),
    Muziek: g('#fa2d48', '<path d="M26 44 V20 L44 16 V40" stroke="#fff" stroke-width="4" fill="none"/><circle cx="22" cy="44" r="5" fill="#fff"/><circle cx="40" cy="40" r="5" fill="#fff"/>'),
    Instellingen: g('#8e8e93', '<circle cx="32" cy="32" r="16" fill="none" stroke="#e5e5ea" stroke-width="7" stroke-dasharray="5 3.4"/><circle cx="32" cy="32" r="9" fill="none" stroke="#e5e5ea" stroke-width="4"/>'),
    Gezondheid: g('#fff', '<path d="M32 48 C14 36 14 22 24 20 C28 19 31 22 32 25 C33 22 36 19 40 20 C50 22 50 36 32 48Z" fill="#ff375f"/>'),
    Rekenmachine: g('#1c1c1e', '<rect x="14" y="14" width="36" height="10" rx="3" fill="#636366"/><circle cx="20" cy="34" r="4" fill="#a5a5a5"/><circle cx="32" cy="34" r="4" fill="#a5a5a5"/><circle cx="44" cy="34" r="4" fill="#ff9f0a"/><circle cx="20" cy="46" r="4" fill="#636366"/><circle cx="32" cy="46" r="4" fill="#636366"/><circle cx="44" cy="46" r="4" fill="#ff9f0a"/>'),
    Podcasts: g('#9b51e0', '<circle cx="32" cy="28" r="14" fill="none" stroke="#fff" stroke-width="3"/><circle cx="32" cy="28" r="5" fill="#fff"/><rect x="29" y="36" width="6" height="16" rx="3" fill="#fff"/>'),
    Boeken: g('#ff9500', '<path d="M14 18 H30 V48 H14Z M34 18 H50 V48 H34Z" fill="#fff"/>'),
    Telefoon: g('#34c759', '<path d="M22 16 L28 16 L31 25 L27 29 C29 34 32 37 36 38 L40 34 L48 37 L48 43 C48 46 45 48 42 48 C28 47 17 36 16 22 C16 19 19 16 22 16Z" fill="#fff"/>'),
    Browser: g('#fff', '<circle cx="32" cy="32" r="22" fill="#0a84ff"/><path d="M40 24 L35 35 L24 40 L29 29Z" fill="#fff"/><path d="M40 24 L35 35 L29 29Z" fill="#ff3b30"/>'),
  };
  APPS.Weer = `<svg viewBox="0 0 64 64"><defs><linearGradient id="w" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4aa3ff"/><stop offset="1" stop-color="#1a6fd6"/></linearGradient></defs><rect width="64" height="64" fill="url(#w)"/><circle cx="26" cy="26" r="10" fill="#ffd60a"/><ellipse cx="36" cy="40" rx="16" ry="9" fill="#fff"/></svg>`;

  const params = new URLSearchParams(location.search);
  const icon = params.get('icon') ?? 'a';
  document.getElementById('screen').classList.add(params.get('wall') === 'light' ? 'wall-light' : 'wall-dark');
  const own = `<img src="icon-${icon}.svg" alt="">`;
  const order = ['Klok', 'Weer', 'Agenda', "Foto's", 'Camera', 'Notities', 'IntervalFit', 'Kaarten', 'Gezondheid', 'Mail', 'Muziek', 'Instellingen', 'Rekenmachine', 'Podcasts', 'Boeken'];
  const cell = (name) => `<div class="app${name === 'IntervalFit' ? ' hl' : ''}"><div class="ic">${name === 'IntervalFit' ? own : APPS[name]}</div><span class="lbl">${name}</span></div>`;
  document.getElementById('grid').innerHTML = order.map(cell).join('');
  document.getElementById('dock').innerHTML = ['Telefoon', 'Browser', 'Berichten', 'Muziek'].map((n) => `<div class="ic">${APPS[n]}</div>`).join('');
</script>
</body>
</html>
