<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!--
    IntervalFit-logo: timer-ring met voortgangsboog en een bliksemschicht (energie).
    Volledig gevuld vierkant; alle inhoud binnen de veilige zone (straal 152 < 205), zodat
    iOS en Android (maskable) zelf de hoeken kunnen afronden zonder iets af te snijden.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#23D596"/>
      <stop offset="1" stop-color="#067A4F"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.28" cy="0.2" r="0.75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#glow)"/>

  <!-- Timer-ring: spoor + voortgangsboog (300°) met gele stip aan het eind -->
  <circle cx="256" cy="256" r="136" fill="none" stroke="#FFFFFF" stroke-opacity="0.24" stroke-width="32"/>
  <path d="M256 120 A136 136 0 1 1 138.2 188" fill="none" stroke="#FFFFFF" stroke-width="32" stroke-linecap="round"/>
  <circle cx="138.2" cy="188" r="22" fill="#FFE066"/>

  <!-- Bliksem: optisch gecentreerd, zachte hoeken -->
  <path d="M283 158 L207 268 H249 L229 354 L305 244 H263 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="10" stroke-linejoin="round"/>
</svg>
